<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias Muns — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #F4F1EA; color: #7B6A58; min-height: 100vh; }

  /* Login */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; flex-direction: column; gap: 16px;
  }
  #login-screen h1 { font-size: 1.5rem; color: #4464AD; }
  #login-screen input {
    padding: 12px 16px; border: 2px solid #C2DCF2; border-radius: 8px;
    font-size: 1rem; width: 280px; outline: none;
  }
  #login-screen input:focus { border-color: #4464AD; }
  #login-screen button {
    padding: 12px 24px; background: #4464AD; color: white;
    border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; width: 280px;
  }
  #login-screen button:hover { background: #3a5599; }
  #login-error { color: #cf2e2e; font-size: 0.9rem; }

  /* Main */
  #main-screen { display: none; }
  header {
    background: #4464AD; color: white; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1.2rem; font-weight: 700; }
  header .actions { display: flex; gap: 12px; }
  .btn {
    padding: 10px 18px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #9FCFE2; color: #1a2e50; }
  .btn-run { background: #EDE6D4; color: #4464AD; }
  .btn-publish { background: #4464AD; color: white; }
  .btn-delete { background: #cf2e2e22; color: #cf2e2e; border: 1px solid #cf2e2e44; }
  .btn-save { background: #7B6A5822; color: #7B6A58; border: 1px solid #7B6A5844; }
  .btn-unpublish { background: #EDE6D4; color: #7B6A58; border: 1px solid #C2DCF2; }
  .btn-feature { background: #fffbe6; color: #b8860b; border: 1px solid #f0d060; }
  .btn-feature.active { background: #f0d060; color: #5a4000; }
  .btn-reimg { background: #f4eeff; color: #7c4dbb; border: 1px solid #d4b8f0; }

  /* Tabs */
  .tabs {
    display: flex; gap: 0; background: #EDE6D4;
    border-bottom: 2px solid #C2DCF2; padding: 0 24px;
  }
  .tab {
    padding: 12px 24px; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; border: none; background: none; color: #CBBBA0;
    border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s;
  }
  .tab.active { color: #4464AD; border-bottom-color: #4464AD; }
  .tab:hover:not(.active) { color: #7B6A58; }

  /* Status bar */
  #status-bar {
    padding: 10px 24px; font-size: 0.85rem; background: #EDE6D4;
    border-bottom: 1px solid #C2DCF2; min-height: 38px;
  }
  #status-bar.error { background: #fde8e8; color: #cf2e2e; }
  #status-bar.success { background: #e8f5e9; color: #2e7d32; }

  /* Grid */
  .drafts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px; padding: 24px;
  }

  /* Card */
  .draft-card {
    background: white; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(68,100,173,0.08);
    overflow: hidden; display: flex; flex-direction: column;
    border: 1px solid #C2DCF2;
  }
  .card-image {
    width: 100%; height: 200px; object-fit: cover;
    background: #C2DCF2; display: block;
  }
  .card-image-placeholder {
    width: 100%; height: 200px; background: linear-gradient(135deg, #9FCFE2, #C2DCF2);
    display: flex; align-items: center; justify-content: center;
    color: #4464AD; font-size: 2.5rem;
  }
  .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .card-title-input {
    font-size: 1rem; font-weight: 700; color: #4464AD;
    border: 1px solid transparent; border-radius: 6px;
    padding: 6px 8px; width: 100%; background: #F4F1EA;
    font-family: inherit; resize: none; line-height: 1.4;
  }
  .card-title-input:focus { outline: none; border-color: #9FCFE2; background: white; }
  .card-content-textarea {
    font-size: 0.85rem; color: #7B6A58; line-height: 1.6;
    border: 1px solid transparent; border-radius: 6px;
    padding: 8px; width: 100%; background: #F4F1EA;
    font-family: inherit; resize: vertical; min-height: 120px;
  }
  .card-content-textarea:focus { outline: none; border-color: #9FCFE2; background: white; }
  .card-meta { font-size: 0.75rem; color: #CBBBA0; }
  .card-link { font-size: 0.75rem; }
  .card-link a { color: #9FCFE2; text-decoration: none; }
  .card-link a:hover { text-decoration: underline; }
  .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; flex-wrap: wrap; }
  .card-actions .btn { flex: 1; font-size: 0.82rem; padding: 9px 10px; min-width: 80px; }

  /* Loading spinner */
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Empty state */
  .empty-state {
    display: none; text-align: center; padding: 60px 24px; color: #CBBBA0;
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
</style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen">
  <h1>🌙 Noticias Muns Admin</h1>
  <input type="password" id="secret-input" placeholder="Contraseña de administrador" />
  <button onclick="doLogin()">Entrar</button>
  <span id="login-error"></span>
</div>

<!-- Main screen -->
<div id="main-screen">
  <header>
    <h1>🌙 Noticias Muns</h1>
    <div class="actions">
      <button class="btn btn-primary" onclick="reload()">↻ Actualizar</button>
      <button class="btn btn-run" id="run-btn" onclick="runPipeline(10)">▶ Generar noticias de hoy</button>
      <button class="btn btn-primary" onclick="runPipeline(1)">🧪 Probar 1</button>
    </div>
  </header>

  <!-- Cargar URL manual -->
  <div id="url-section" style="display:flex; gap:10px; align-items:center; padding:12px 24px; background:#EDE6D4; border-bottom:1px solid #C2DCF2;">
    <input id="url-input" type="url" placeholder="Pegá la URL de la noticia que querés publicar..."
      style="flex:1; padding:10px 14px; border:2px solid #C2DCF2; border-radius:8px; font-size:0.9rem; outline:none; font-family:inherit; background:white; color:#4464AD;"
      onfocus="this.style.borderColor='#4464AD'" onblur="this.style.borderColor='#C2DCF2'"
    />
    <button class="btn btn-publish" id="url-btn" onclick="processUrl()">📰 Procesar URL</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-drafts" onclick="switchTab('drafts')">Borradores</button>
    <button class="tab" id="tab-published" onclick="switchTab('published')">Publicadas</button>
  </div>

  <div id="status-bar">Cargando...</div>

  <!-- Borradores -->
  <div id="view-drafts">
    <div id="drafts-grid" class="drafts-grid"></div>
    <div id="drafts-empty" class="empty-state">
      <div class="emoji">📭</div>
      <p>No hay borradores. Presioná "Generar noticias de hoy" para comenzar.</p>
    </div>
  </div>

  <!-- Publicadas -->
  <div id="view-published" style="display:none;">
    <div id="published-grid" class="drafts-grid"></div>
    <div id="published-empty" class="empty-state">
      <div class="emoji">📰</div>
      <p>No hay notas publicadas todavía.</p>
    </div>
  </div>
</div>

<script>
const API = 'https://infomuns-production.up.railway.app';
let token = localStorage.getItem('noticias_admin_token') || '';
let currentTab = 'drafts';

function setStatus(msg, type = '') {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.className = type;
}

function doLogin() {
  const val = document.getElementById('secret-input').value.trim();
  if (!val) return;
  token = val;
  localStorage.setItem('noticias_admin_token', token);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  loadDrafts();
}

document.getElementById('secret-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-drafts').classList.toggle('active', tab === 'drafts');
  document.getElementById('tab-published').classList.toggle('active', tab === 'published');
  document.getElementById('view-drafts').style.display = tab === 'drafts' ? 'block' : 'none';
  document.getElementById('view-published').style.display = tab === 'published' ? 'block' : 'none';
  if (tab === 'drafts') loadDrafts();
  else loadPublished();
}

function reload() {
  if (currentTab === 'drafts') loadDrafts();
  else loadPublished();
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(`${API}/api/noticias${path}`, {
    ...opts,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (res.status === 401) {
    localStorage.removeItem('noticias_admin_token');
    location.reload();
    throw new Error('No autorizado');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Error ${res.status}`);
  }
  return res.json();
}

// ── BORRADORES ──

async function loadDrafts() {
  setStatus('Cargando borradores...');
  try {
    const drafts = await apiFetch('/drafts');
    renderCards(drafts, 'drafts-grid', 'drafts-empty', 'draft');
    setStatus(drafts.length > 0 ? `${drafts.length} borradores listos para revisar` : 'No hay borradores', '');
  } catch (err) {
    setStatus('Error: ' + err.message, 'error');
  }
}

async function saveDraft(id, btn) {
  const card = btn.closest('.draft-card');
  const title = card.querySelector('[data-field="title"]').value;
  const content = card.querySelector('[data-field="content"]').value;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  try {
    await apiFetch(`/drafts/${id}`, { method: 'PUT', body: JSON.stringify({ title, content }) });
    btn.textContent = '✓ Guardado';
    setTimeout(() => { btn.textContent = 'Guardar'; btn.disabled = false; }, 2000);
    setStatus('Guardado correctamente', 'success');
  } catch (err) {
    btn.textContent = 'Guardar'; btn.disabled = false;
    setStatus('Error guardando: ' + err.message, 'error');
  }
}

async function publishDraft(id, btn) {
  if (!confirm('¿Publicar esta nota en muns.club?')) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Publicando...';
  try {
    const post = await apiFetch(`/drafts/${id}/publish`, { method: 'POST' });
    const card = btn.closest('.draft-card');
    card.style.opacity = '0.4'; card.style.pointerEvents = 'none';
    setStatus(`✓ Publicado: "${post.title}"`, 'success');
    setTimeout(() => card.remove(), 1500);
  } catch (err) {
    btn.textContent = 'Publicar'; btn.disabled = false;
    setStatus('Error publicando: ' + err.message, 'error');
  }
}

async function deleteDraft(id, btn) {
  if (!confirm('¿Eliminar este borrador? No se puede deshacer.')) return;
  btn.disabled = true;
  try {
    await apiFetch(`/drafts/${id}`, { method: 'DELETE' });
    removeCard(btn);
    setStatus('Borrador eliminado', '');
  } catch (err) {
    btn.disabled = false;
    setStatus('Error eliminando: ' + err.message, 'error');
  }
}

// ── PUBLICADAS ──

async function loadPublished() {
  setStatus('Cargando notas publicadas...');
  try {
    const posts = await apiFetch('/published');
    renderCards(posts, 'published-grid', 'published-empty', 'published');
    setStatus(posts.length > 0 ? `${posts.length} notas publicadas` : 'No hay notas publicadas', '');
  } catch (err) {
    setStatus('Error: ' + err.message, 'error');
  }
}

async function savePublished(id, btn) {
  const card = btn.closest('.draft-card');
  const title = card.querySelector('[data-field="title"]').value;
  const content = card.querySelector('[data-field="content"]').value;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
  try {
    await apiFetch(`/published/${id}`, { method: 'PUT', body: JSON.stringify({ title, content }) });
    btn.textContent = '✓ Guardado';
    setTimeout(() => { btn.textContent = 'Guardar'; btn.disabled = false; }, 2000);
    setStatus('Guardado correctamente', 'success');
  } catch (err) {
    btn.textContent = 'Guardar'; btn.disabled = false;
    setStatus('Error guardando: ' + err.message, 'error');
  }
}

async function unpublishPost(id, btn) {
  if (!confirm('¿Volver a borrador? Se va a quitar de muns.club.')) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>...';
  try {
    await apiFetch(`/published/${id}/unpublish`, { method: 'POST' });
    const card = btn.closest('.draft-card');
    card.style.opacity = '0.4'; card.style.pointerEvents = 'none';
    setStatus('Nota movida a borradores', 'success');
    setTimeout(() => card.remove(), 1500);
  } catch (err) {
    btn.textContent = 'A borrador'; btn.disabled = false;
    setStatus('Error: ' + err.message, 'error');
  }
}

async function featurePost(id, btn) {
  btn.disabled = true;
  try {
    await apiFetch(`/published/${id}/feature`, { method: 'POST' });
    // Quitar destacada de todas las cards
    document.querySelectorAll('.btn-feature').forEach(b => {
      b.classList.remove('active');
      b.textContent = '☆ Destacar';
    });
    btn.classList.add('active');
    btn.textContent = '⭐ Destacada';
    setStatus('Noticia destacada actualizada. Se verá arriba en /infomuns.', 'success');
  } catch (err) {
    setStatus('Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

async function deletePublished(id, btn) {
  if (!confirm('¿Eliminar permanentemente esta nota publicada? No se puede deshacer.')) return;
  btn.disabled = true;
  try {
    await apiFetch(`/published/${id}`, { method: 'DELETE' });
    removeCard(btn);
    setStatus('Nota eliminada', '');
  } catch (err) {
    btn.disabled = false;
    setStatus('Error eliminando: ' + err.message, 'error');
  }
}

// ── RENDER ──

function stripHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  return div.textContent || div.innerText || '';
}

function escapeHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function removeCard(btn) {
  const card = btn.closest('.draft-card');
  card.style.opacity = '0';
  card.style.transform = 'scale(0.95)';
  card.style.transition = 'all 0.2s';
  setTimeout(() => card.remove(), 250);
}

function renderCards(posts, gridId, emptyId, type) {
  const grid = document.getElementById(gridId);
  const empty = document.getElementById(emptyId);
  grid.innerHTML = '';

  if (posts.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  posts.forEach(post => {
    const card = document.createElement('div');
    card.className = 'draft-card';
    card.dataset.id = post.id;

    const cleanContent = stripHtml(post.content);
    const imageHtml = post.featuredMediaUrl
      ? `<img class="card-image" src="${post.featuredMediaUrl}" alt="" loading="lazy" />`
      : `<div class="card-image-placeholder">🌙</div>`;

    const actionsHtml = type === 'draft'
      ? `<button class="btn btn-save" onclick="saveDraft(${post.id}, this)">Guardar</button>
         <button class="btn btn-publish" onclick="publishDraft(${post.id}, this)">Publicar</button>
         <button class="btn btn-reimg" onclick="regenerateImage(${post.id}, this)">🎨 Nueva imagen</button>
         <button class="btn btn-delete" onclick="deleteDraft(${post.id}, this)">Borrar</button>`
      : `<button class="btn btn-feature ${post.isFeatured ? 'active' : ''}" onclick="featurePost(${post.id}, this)">${post.isFeatured ? '⭐ Destacada' : '☆ Destacar'}</button>
         <button class="btn btn-save" onclick="savePublished(${post.id}, this)">Guardar</button>
         <button class="btn btn-unpublish" onclick="unpublishPost(${post.id}, this)">A borrador</button>
         <button class="btn btn-delete" onclick="deletePublished(${post.id}, this)">Borrar</button>`;

    const linkHtml = type === 'published' && post.link
      ? `<div class="card-link"><a href="${post.link}" target="_blank">🔗 Ver en muns.club</a></div>`
      : '';

    card.innerHTML = `
      ${imageHtml}
      <div class="card-body">
        <textarea class="card-title-input" rows="2" data-field="title">${escapeHtml(post.title)}</textarea>
        <textarea class="card-content-textarea" data-field="content">${escapeHtml(cleanContent)}</textarea>
        <div class="card-meta">📅 ${new Date(post.date).toLocaleDateString('es-AR')}</div>
        ${linkHtml}
        <div class="card-actions">${actionsHtml}</div>
      </div>`;

    grid.appendChild(card);
  });
}

async function regenerateImage(id, btn) {
  const card = btn.closest('.draft-card');
  const title = card.querySelector('[data-field="title"]').value;
  const content = card.querySelector('[data-field="content"]').value;
  // 1. Intentar source-image guardado
  let imageUrl = (content.match(/<!--\s*source-image:\s*(\S+)\s*-->/) || [])[1] || null;
  // 2. Si no hay, extraer el link del artículo fuente — formato: "Fuente original (SRC): https://..."
  let articleUrl = null;
  if (!imageUrl) {
    articleUrl = (content.match(/Fuente original[^:]*:\s*(https?:\/\/\S+)/) || [])[1] || null;
  }
  if (!imageUrl && !articleUrl) {
    setStatus('Esta noticia no tiene foto original guardada', 'error');
    return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Generando...';
  setStatus('Generando nueva imagen, puede tardar 30-60 segundos...');
  try {
    const result = await apiFetch(`/drafts/${id}/regenerate-image`, {
      method: 'POST',
      body: JSON.stringify({ title, imageUrl, articleUrl })
    });
    // Reemplazar imagen en la card
    const existing = card.querySelector('.card-image, .card-image-placeholder');
    if (existing && result.mediaUrl) {
      const img = document.createElement('img');
      img.className = 'card-image';
      img.src = result.mediaUrl;
      img.alt = '';
      img.loading = 'lazy';
      existing.replaceWith(img);
    }
    btn.textContent = '✓ Lista'; btn.disabled = false;
    setStatus('Nueva imagen generada correctamente', 'success');
    setTimeout(() => { btn.textContent = '🎨 Nueva imagen'; }, 3000);
  } catch (err) {
    btn.textContent = '🎨 Nueva imagen'; btn.disabled = false;
    setStatus('Error generando imagen: ' + err.message, 'error');
  }
}

async function processUrl() {
  const input = document.getElementById('url-input');
  const url = input.value.trim();
  if (!url) { setStatus('Pegá una URL primero', 'error'); return; }
  try { new URL(url); } catch { setStatus('La URL no es válida', 'error'); return; }

  const btn = document.getElementById('url-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Procesando...';
  setStatus('Procesando la noticia... puede tardar 30-60 segundos.');

  try {
    const result = await apiFetch('/from-url', { method: 'POST', body: JSON.stringify({ url }) });
    input.value = '';
    btn.textContent = '✓ Listo';
    setStatus(`✓ Borrador creado: "${result.draft.title}"`, 'success');
    setTimeout(() => { btn.textContent = '📰 Procesar URL'; btn.disabled = false; }, 2000);
    if (currentTab === 'drafts') setTimeout(loadDrafts, 500);
    else switchTab('drafts');
  } catch (err) {
    btn.textContent = '📰 Procesar URL'; btn.disabled = false;
    setStatus('Error: ' + err.message, 'error');
  }
}

async function runPipeline(limit = 10) {
  const msg = limit === 1 ? '¿Generar 1 nota de prueba?' : '¿Generar las noticias de hoy? El proceso tarda unos minutos.';
  if (!confirm(msg)) return;
  const btn = document.getElementById('run-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Generando...';
  setStatus(limit === 1 ? 'Generando 1 nota de prueba...' : 'Generando noticias... esto puede tardar 3-5 minutos.');
  try {
    const result = await apiFetch('/run', { method: 'POST', body: JSON.stringify({ limit }) });
    btn.textContent = '▶ Generar noticias de hoy'; btn.disabled = false;
    setStatus(`✓ ${result.result.succeeded} noticias generadas, ${result.result.failed} errores`, 'success');
    setTimeout(loadDrafts, 1000);
  } catch (err) {
    btn.textContent = '▶ Generar noticias de hoy'; btn.disabled = false;
    setStatus('Error: ' + err.message, 'error');
  }
}

// Auto-login si ya tiene token guardado
if (token) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  loadDrafts();
}
</script>
</body>
</html>
